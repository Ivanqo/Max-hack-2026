name: UniPath MAX
version: 1.0.0
description: Contest API checks for the main MAX mini-app scenario.
base_url: http://localhost:8000
openapi: ./openapi.yaml
auth:
  type: bearer
  login_endpoint: /api/auth/login/
  demo_accounts:
    student:
      email: student@demo.local
      password: demo12345
      role: student
    admin:
      email: admin@demo.local
      password: demo12345
      role: admin
    second_tenant_student:
      email: student@north.local
      password: demo12345
      role: student
checks:
  - id: health
    method: GET
    path: /api/health/
    expect_status: 200
  - id: login_student
    method: POST
    path: /api/auth/login/
    body:
      email: student@demo.local
      password: demo12345
    expect_status: 200
    extracts:
      student_token: $.access
  - id: prevent_privilege_escalation
    method: POST
    path: /api/auth/register/
    body:
      email: admin-attempt@example.local
      password: demo12345
      password2: demo12345
      first_name: Admin
      last_name: Attempt
      role: admin
    expect_status: 400
  - id: onboarding
    method: POST
    path: /api/onboarding
    auth: student_token
    body:
      universityId: "1"
      instituteId: mgsu-digital
      courseId: mgsu-bim
      studyYear: "3"
      interests: [BIM, стажировки, практика]
      skills:
        - name: BIM-моделирование
          level: 4
        - name: Revit
          level: 3
      careerGoal: BIM-координатор в строительстве
    expect_status: 200
  - id: career_gps
    method: GET
    path: /api/student/career-gps
    auth: student_token
    expect_status: 200
  - id: opportunities
    method: GET
    path: /api/student/opportunities
    auth: student_token
    expect_status: 200
    extracts:
      opportunity_id: $[0].id
  - id: save_opportunity
    method: POST
    path: /api/student/opportunities/{opportunity_id}/save
    auth: student_token
    expect_status: 200
  - id: create_subscription
    method: POST
    path: /api/student/subscriptions
    auth: student_token
    body:
      topic: BIM
      filters:
        topic: BIM
      active: true
    expect_status: 201
  - id: login_admin
    method: POST
    path: /api/auth/login/
    body:
      email: admin@demo.local
      password: demo12345
    expect_status: 200
    extracts:
      admin_token: $.access
  - id: admin_publish_matching_opportunity
    method: POST
    path: /api/admin/opportunities
    auth: admin_token
    body:
      title: BIM MAX Bot Internship
      company: Мосинжпроект
      description: Build a BIM notification scenario for construction students.
      type: internship
      location: Москва / кампус
      remote: true
      requirements: [BIM, Revit, Navisworks]
      status: active
    expect_status: 201
    extracts:
      published_opportunity_id: $.id
  - id: verify_subscription_notification
    method: GET
    path: /api/v1/notifications/?opportunity={published_opportunity_id}
    auth: student_token
    expect_status: 200
    expect:
      count: 1
      results[0].delivery_status: simulated
  - id: verify_publish_idempotency
    method: PUT
    path: /api/admin/opportunities/{published_opportunity_id}
    auth: admin_token
    body:
      title: BIM MAX Bot Internship
      company: Мосинжпроект
      description: Build a BIM notification scenario for construction students.
      type: internship
      location: Москва / кампус
      remote: true
      requirements: [BIM, Revit, Navisworks]
      status: active
    expect_status: 200
  - id: knowledge_search
    method: GET
    path: /api/knowledge/search?q=практика
    auth: student_token
    expect_status: 200
  - id: admin_analytics
    method: GET
    path: /api/admin/analytics
    auth: admin_token
    expect_status: 200
notes:
  - MAX_INTEGRATION_MODE=mock keeps local demo deterministic and marks notifications as simulated.
  - Run executable check with `backend/.venv/Scripts/python.exe backend/scripts/smoke_data_api.py --base-url http://localhost:8000` on Windows or `python backend/scripts/smoke_data_api.py --base-url http://localhost:8000` on Unix.
  - MAX_INTEGRATION_MODE=real uses https://platform-api2.max.ru/messages with Authorization header and requires MAX_BOT_TOKEN, MAX_WEBHOOK_SECRET, HTTPS webhook URL, and MAX_OPEN_APP_TARGET for open_app return buttons.
