# DATA-API 1.0
# Test credentials are supplied to the evaluator through its protected channel.

schemaVersion: "1.0"

solution:
  name: "UniPath MAX"

api:
  baseUrl: "https://188-120-251-143.sslip.io"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Доступность API"
    description: "Проверяет, что публичный backend отвечает по HTTPS."
    method: "GET"
    path: "/api/health/"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
    timeoutMs: 10000
    repeatable: true

  - id: "student_opportunities"
    name: "Подбор возможностей для студента"
    method: "GET"
    path: "/api/student/opportunities"
    role: "student"
    request:
      query:
        type: "internship"
        minMatch: 0
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 10000
    repeatable: true

  - id: "student_create_bim_subscription"
    name: "Подписка студента на возможности BIM"
    method: "POST"
    path: "/api/v1/subscriptions/"
    role: "student"
    request:
      headers:
        Content-Type: "application/json"
      body:
        topic: "BIM"
        filters:
          topic: "BIM"
        active: true
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "topic"]
    timeoutMs: 10000
    repeatable: false
    extract:
      subscriptionId: "$.id"

  - id: "admin_publish_opportunity"
    name: "Публикация стажировки администратором"
    description: "Публикует тестовую стажировку и может отправить реальное сообщение MAX. Тестовые студент и администратор должны относиться к одному вузу; профиль студента должен быть связан с MAX."
    method: "POST"
    path: "/api/admin/opportunities"
    role: "admin"
    dependsOn: ["student_create_bim_subscription"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        title: "Тест DATA-API: стажировка BIM"
        company: "Тестовая компания"
        description: "Проверка публикации возможности и уведомления студента."
        type: "internship"
        location: "Москва"
        remote: true
        requirements: ["BIM", "Revit", "Navisworks"]
        status: "active"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "title"]
    timeoutMs: 10000
    repeatable: false
    extract:
      publishedOpportunityId: "$.id"

  - id: "student_notification_for_published_opportunity"
    name: "Уведомление MAX о новой возможности"
    description: "Проверяет, что студенту доступно уведомление, связанное с опубликованной стажировкой."
    method: "GET"
    path: "/api/v1/notifications/"
    role: "student"
    dependsOn: ["admin_publish_opportunity"]
    request:
      query:
        opportunity: "${publishedOpportunityId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["count", "results"]
      bodySchema:
        type: "object"
        required: ["count", "results"]
        properties:
          count:
            type: "integer"
            minimum: 1
          results:
            type: "array"
            minItems: 1
            items:
              type: "object"
              required: ["delivery_status"]
              properties:
                delivery_status:
                  const: "sent"
    timeoutMs: 10000
    repeatable: true

  - id: "student_open_published_opportunity"
    name: "Открытие подходящей возможности студентом"
    description: "Записывает interaction event открытия возможности, поэтому этот проверочный GET не является безопасным для повторного запуска."
    method: "GET"
    path: "/api/student/opportunities/{id}"
    role: "student"
    dependsOn: ["admin_publish_opportunity"]
    request:
      path:
        id: "${publishedOpportunityId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "title"]
    timeoutMs: 10000
    repeatable: false

cleanup:
  - id: "delete_test_subscription"
    method: "DELETE"
    path: "/api/v1/subscriptions/{id}/"
    role: "student"
    request:
      path:
        id: "${subscriptionId}"
    expected:
      statusCodes: [204]
    timeoutMs: 10000

  - id: "delete_test_opportunity"
    method: "DELETE"
    path: "/api/admin/opportunities/{id}"
    role: "admin"
    request:
      path:
        id: "${publishedOpportunityId}"
    expected:
      statusCodes: [204]
    timeoutMs: 10000
